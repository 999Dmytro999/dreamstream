<div class="shell">
  <header class="topbar" [class.mobile-menu-open]="mobileNavOpen">
    <div class="brand">
      <a routerLink="/" class="brand-link" aria-label="DreamStream home" (click)="closeMobileNav()">
        <span class="brand-mark" [class.brand-mark-fallback]="logoLoadFailed">
          <img
            *ngIf="!logoLoadFailed"
            src="/assets/icons/dreamstream-logo-mark.png"
            alt="DreamStream logo"
            class="brand-logo-image"
            (error)="logoLoadFailed = true"
          />
          <span class="brand-fallback-mark" aria-hidden="true">
            <span class="brand-person person-one"></span>
            <span class="brand-person person-two"></span>
            <span class="brand-person person-three"></span>
            <span class="brand-heart"></span>
          </span>
        </span>
        <span class="brand-copy">
          <span class="brand-name">DreamStream</span>
          <span class="brand-tag">Help requests and offers</span>
        </span>
      </a>
    </div>

    <button
      type="button"
      class="mobile-menu-toggle"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="mobileNavOpen"
      [attr.aria-label]="mobileNavOpen ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMobileNav()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path *ngIf="!mobileNavOpen" d="M4 7h16M4 12h16M4 17h16" />
        <path *ngIf="mobileNavOpen" d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>

    <nav id="primary-navigation" class="nav" aria-label="Primary navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M6 10.5V20h12v-9.5" />
          <path d="M9.5 20v-5h5v5" />
        </svg>
        <span>Home</span>
      </a>
      <a
        routerLink="/requests"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" />
        </svg>
        <span>Offer Help</span>
      </a>
      <a
        routerLink="/requests/new"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 14.5c1.5 1.7 3.5 2.4 6 2.1" />
          <path d="M5 15.5c2.3 3 5.8 4.4 10.5 4.1 1.4-.1 2.5-.7 3.5-1.6" />
          <path d="M15 5.5c1.8.7 2.8 2 3 4" />
          <path d="M11 8.5c2.2.4 3.7 1.6 4.5 3.5" />
        </svg>
        <span>Request Help</span>
      </a>
      <a
        routerLink="/my-requests"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4h10l2 2v14H5V6l2-2Z" />
          <path d="M8.5 9h7" />
          <path d="M8.5 13h7" />
          <path d="M8.5 17h4" />
        </svg>
        <span>My Requests</span>
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
          <path d="M4.5 21a7.5 7.5 0 0 1 15 0" />
        </svg>
        <span>Profile</span>
      </a>
      <ng-container *ngIf="!(currentUser$ | async)">
        <a
          routerLink="/login"
          routerLinkActive="active"
          class="nav-link nav-link-guest"
          (click)="closeMobileNav()"
        >
          <span>Login</span>
        </a>
        <a
          routerLink="/register"
          routerLinkActive="active"
          class="nav-link nav-link-guest"
          (click)="closeMobileNav()"
        >
          <span>Register</span>
        </a>
      </ng-container>
    </nav>

    <div class="user-panel">
      <ng-container *ngIf="currentUser$ | async as user; else guestState">
        <span class="user-name">{{ user.displayName || user.email }}</span>
        <button type="button" class="button button-secondary" (click)="logout()">Logout</button>
      </ng-container>
      <ng-template #guestState>
        <span class="user-name muted">Guest</span>
      </ng-template>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
