name: Docs CI

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - '.github/workflows/**'

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify required documentation and governance files
        run: node scripts/docs.mjs
